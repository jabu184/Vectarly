services:
  vectarly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vectarly
    restart: unless-stopped
    ports:
      - "${PORT:-3004}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
